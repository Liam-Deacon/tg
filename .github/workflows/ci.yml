name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake pkg-config \
            libconfig-dev libevent-dev libjansson-dev libreadline-dev \
            liblua5.3-dev libssl-dev zlib1g-dev

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install \
            autoconf automake cmake pkg-config \
            libconfig libevent jansson lua openssl@3 readline

      - name: Autotools build
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
            export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix readline)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          fi
          ./configure
          make -j2
          make clean

      - name: CMake build
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
            export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix readline)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          fi
          cmake -S . -B build -DTG_ENABLE_PYTHON=OFF
          cmake --build build -j2
